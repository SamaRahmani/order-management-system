spring.application.name=inventory-service

server.port=8082

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization
spring.kafka.consumer.properties[spring.json.value.default.type]=com.oms.inventory.event.OrderEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.oms.inventory.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

# Start reading from the earliest available offset if this group has no committed offset
spring.kafka.consumer.auto-offset-reset=earliest